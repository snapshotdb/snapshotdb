      @font-face {

      :root {

        --ink: #efe9df;
        --white: #fbf7ef;
        --muted: #8f887c;
        --line: #302b25;
        --grotesk: "Bricolage Grotesque", -apple-system, "Helvetica Neue", sans-serif;

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--grotesk);
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }

      /* persistent hairline frame + corner ticks, matching the site's own chrome */
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid var(--line);
        pointer-events: none;
      }
      .tick {
        position: absolute;
        width: 14px;
        height: 14px;
      }
      .tick::before,
      .tick::after {
        content: "";
        position: absolute;
        background: var(--muted);
      }
      .tick::before {
        width: 14px;
        height: 1px;
      }
      .tick::after {
        width: 1px;
        height: 14px;
      }
      .tick.tl {
        top: -1px;
        left: -1px;
      }
      .tick.tr {
        top: -1px;
        right: -1px;
      }
      .tick.tr::before {
        right: 0;
      }
      .tick.tr::after {
        right: 0;
      }
      .tick.bl {
        bottom: -1px;
        left: -1px;
      }
      .tick.bl::before {
        bottom: 0;
      }
      .tick.bl::after {
        bottom: 0;
      }
      .tick.br {
        bottom: -1px;
        right: -1px;
      }
      .tick.br::before {
        bottom: 0;
        right: 0;
      }
      .tick.br::after {
        bottom: 0;
        right: 0;
      }

      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      /* Scene 2 — the number */
      #scene-number .num-wrap {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 18px;
      }
      #scene-number .counter {
        font-family: var(--grotesk);
        font-weight: 800;
        font-size: 180px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--white);
        font-variant-numeric: tabular-nums;
        transform-origin: center center;
        display: inline-block;
      }
      #scene-number .counter-suffix {
        font-family: var(--grotesk);
        font-weight: 800;
        font-size: 72px;
        color: var(--muted);
        opacity: 0;
      }
      #scene-number .num-label {
        margin-top: 28px;
        font-family: var(--mono);
        font-size: 22px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        text-align: center;
      }

      /* Scene 4 — outro */
      #scene-outro {
        flex-direction: column;
        gap: 22px;
      }
      #scene-outro .logo-row {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--grotesk);
        font-weight: 800;
        font-size: 64px;
        color: var(--white);
      }
      #scene-outro .logo-row em {
        font-style: normal;
        color: var(--muted);
        font-weight: 800;
      }
      #scene-outro .logo-row svg {
        width: 52px;
        height: 52px;
      }
      #scene-outro .punchline {
        font-family: var(--grotesk);
        font-weight: 800;
        font-size: 46px;
        color: var(--ink);
        text-align: center;
      }
      #scene-outro .domain {
        font-family: var(--mono);
        font-size: 22px;
        letter-spacing: 0.1em;
        color: var(--muted);
      }
      #scene-outro .oss {
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.85;
      }

        );
        tl.fromTo(
          "#scene-outro .domain",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          OUTRO_START + 0.55,
        );
        tl.fromTo(
          "#scene-outro .oss",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out" },
          OUTRO_START + 0.75,
        );
      })();

      // Music fade-in / fade-out (baseline gain is data-volume=0.5; carve.mjs adds ducking under narration)
      tl.fromTo("#music-bed", { volume: 0 }, { volume: 0.5, duration: 0.6, ease: "power1.out" }, 0);
      tl.to("#music-bed", { volume: 0, duration: 1.2, ease: "power1.in" }, 18.8);

      window.__timelines = window.__timelines || {};
      window.__timelines["anybranch-brag"] = tl;
    </script>
