[package]
name = "snapshotdb"
version = "0.4.0"
edition = "2021"
description = "Instant copy-on-write branches of any local database: Postgres, MySQL, SQLite, MongoDB."
license = "Apache-2.0"

[dependencies]
fs2 = "0.4"
signal-hook = "0.4"
serde_json = "1"
tiny_http = "0.12"
ureq = "3"
rusqlite = { version = "0.40", features = ["bundled", "hooks", "limits"] }
