app = "anybranch-snapshotdb"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "anybranch_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[http_service]
  internal_port = 7432
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
